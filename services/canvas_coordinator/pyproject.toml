[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "canvasserver_python_package"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    # APScheduler 4 has a different API (no BackgroundScheduler)
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "matplotlib",
    "numba",
    "numpy",
    "pillow",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",
    "pyyaml",
    "qrcode",
    "requests",
    "rich",
    "sqlmodel>=0.0.22",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "monkeytype",
    "pre-commit",
    "pytest",
]

[tool.setuptools.dynamic]
version = { attr = "canvasserver.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
